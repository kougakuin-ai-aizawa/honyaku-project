<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI音声通訳アプリ</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white p-6 md:p-8 rounded-2xl shadow-xl w-full max-w-lg text-center space-y-6">
        <div>
            <h1 class="text-2xl font-bold text-slate-800">🎙️ AIリアルタイム音声翻訳</h1>
            <p id="status" class="text-sm text-slate-500 mt-1">「お話を始める」を押して喋ってください</p>
        </div>

        <!-- 日本語（音声認識結果） -->
        <div class="text-left space-y-1">
            <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider">日本語（音声認識）</label>
            <div id="result-box" class="bg-slate-50 p-4 rounded-xl border border-slate-200 min-h-[90px] text-lg text-slate-700 whitespace-pre-wrap break-words">
                ここに喋った言葉が表示されます...
            </div>
        </div>

        <!-- 英語（AI翻訳結果） -->
        <div class="text-left space-y-1">
            <div class="flex justify-between items-center">
                <label class="text-xs font-semibold text-indigo-500 uppercase tracking-wider">English (AI Translation)</label>
                <button id="speak-btn" class="hidden text-xs bg-indigo-100 hover:bg-indigo-200 text-indigo-700 font-semibold py-1 px-3 rounded-full transition-colors">
                    🔊 発音を聞く
                </button>
            </div>
            <div id="translated-box" class="bg-indigo-50/60 p-4 rounded-xl border border-indigo-100 min-h-[90px] text-lg text-indigo-950 whitespace-pre-wrap break-words">
                ここに英語の訳文が表示されます...
            </div>
        </div>

        <!-- 操作ボタン -->
        <div class="pt-2">
            <button id="mic-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-md hover:shadow-lg transition-all transform active:scale-98 flex items-center justify-center gap-2 text-base">
                🎙️ お話を始める
            </button>
        </div>
    </div>

    <script>
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const API_URL = "http://127.0.0.1:8000/translate"; // FastAPI サーバーのURL

        if (!SpeechRecognition) {
            alert("お使いのブラウザは音声認識に対応していません。Google ChromeやSafariでお試しください。");
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP';
            recognition.interimResults = true;
            recognition.continuous = true;

            const micBtn = document.getElementById('mic-btn');
            const speakBtn = document.getElementById('speak-btn');
            const resultBox = document.getElementById('result-box');
            const translatedBox = document.getElementById('translated-box');
            const statusText = document.getElementById('status');

            let isRecording = false;
            let finalTranscript = '';

            // マイクボタン押下
            micBtn.addEventListener('click', () => {
                if (!isRecording) {
                    startRecording();
                } else {
                    stopRecording();
                }
            });

            // 英語読み上げボタン押下
            speakBtn.addEventListener('click', () => {
                const englishText = translatedBox.innerText.trim();
                if (englishText && 'speechSynthesis' in window) {
                    const utterance = new SpeechSynthesisUtterance(englishText);
                    utterance.lang = 'en-US';
                    window.speechSynthesis.speak(utterance);
                }
            });

            function startRecording() {
                finalTranscript = '';
                resultBox.innerText = "";
                translatedBox.innerText = "ここに英語の訳文が表示されます...";
                speakBtn.classList.add('hidden');
                recognition.start();
            }

            function stopRecording() {
                isRecording = false;
                recognition.stop();
            }

            recognition.onstart = () => {
                isRecording = true;
                statusText.innerText = "🎤 聞き取り中...（話し終わったら止めるを押してね）";
                statusText.className = "text-sm text-red-500 font-medium animate-pulse mt-1";
                
                micBtn.innerText = "🛑 録音を止めて翻訳する";
                micBtn.className = "w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-md transition-all transform active:scale-98 flex items-center justify-center gap-2 text-base";
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript + ' ';
                    } else {
                        interimTranscript += transcript;
                    }
                }
                resultBox.innerText = finalTranscript + interimTranscript;
            };

            recognition.onerror = (event) => {
                console.error("音声認識エラー:", event.error);
                statusText.innerText = "❌ 音声認識エラーが発生しました";
                statusText.className = "text-sm text-red-500 mt-1";
                resetUI();
            };

            recognition.onend = async () => {
                // 自動停止への対策（ユーザーが止めるまでループ）
                if (isRecording) {
                    try {
                        recognition.start();
                        return;
                    } catch (e) {
                        console.error("再接続失敗:", e);
                    }
                }

                resetUI();

                const textToTranslate = resultBox.innerText.trim();
                if (textToTranslate && textToTranslate !== "ここに喋った言葉が表示されます...") {
                    await fetchTranslation(textToTranslate);
                }
            };

            function resetUI() {
                isRecording = false;
                micBtn.innerText = "🎙️ お話を始める";
                micBtn.className = "w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-md hover:shadow-lg transition-all transform active:scale-98 flex items-center justify-center gap-2 text-base";
            }

            async function fetchTranslation(text) {
                statusText.innerText = "⏳ 英語に翻訳中...";
                statusText.className = "text-sm text-indigo-600 font-medium animate-pulse mt-1";

                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text: text })
                    });

                    if (!response.ok) throw new Error('サーバーエラー');

                    const data = await response.json();
                    translatedBox.innerText = data.translation;
                    statusText.innerText = "✨ 翻訳完了！";
                    statusText.className = "text-sm text-emerald-600 font-medium mt-1";
                    speakBtn.classList.remove('hidden'); // 翻訳後に音声再生ボタンを表示
                } catch (error) {
                    console.error('通信エラー:', error);
                    statusText.innerText = "❌ 翻訳エラー：Pythonサーバーが起動しているか確認してください";
                    statusText.className = "text-sm text-red-500 mt-1";
                    translatedBox.innerText = "翻訳の取得に失敗しました。";
                }
            }
        }
    </script>
</body>
</html>
