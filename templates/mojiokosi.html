<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ステップ1：文字起こしのテスト</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md text-center">
        <h1 class="text-xl font-bold text-slate-800 mb-4">音声認識テスト</h1>
        
        <p id="status" class="text-sm text-slate-500 mb-6">下のボタンを押して喋ってね</p>

        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 min-h-[100px] text-left text-lg text-slate-700 mb-6 whitespace-pre-wrap break-words" id="result-box">ここに喋った言葉が出ます...</div>

        <button id="mic-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-full shadow-lg transition-all transform active:scale-95">
            🎙️ お話を始める
        </button>
    </div>

    <script>
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            alert("お使いのブラウザは音声認識に対応していません。ChromeやSafariで試してね！");
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP';
            recognition.interimResults = true; // 途中経過を表示
            recognition.continuous = true;     // 連続認識

            const micBtn = document.getElementById('mic-btn');
            const resultBox = document.getElementById('result-box');
            const statusText = document.getElementById('status');
            
            let isRecording = false;
            let finalTranscript = ''; // 確定したテキストを保持する変数

            // ボタンを押したときの処理
            micBtn.addEventListener('click', () => {
                if (!isRecording) {
                    finalTranscript = ''; // 録音開始時に過去の文字をリセット
                    recognition.start();
                } else {
                    isRecording = false; // ユーザーが明示的に止めたフラグ
                    recognition.stop();
                }
            });

            // 録音スタート時
            recognition.onstart = () => {
                isRecording = true;
                statusText.innerText = "🎤 聞き取り中... 喋ってみてください！";
                statusText.classList.add('text-red-500');
                
                micBtn.innerText = "🛑 止める";
                micBtn.className = "bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-6 rounded-full shadow-lg transition-all transform active:scale-95";
                resultBox.innerText = "";
            };

            // 喋っている最中・文章が確定したとき
            recognition.onresult = (event) => {
                let interimTranscript = ''; // 認識途中の文字

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript + '\n';
                    } else {
                        interimTranscript += transcript;
                    }
                }

                // 確定したテキスト ＋ 現在喋っている途中のテキストを表示
                resultBox.innerText = finalTranscript + interimTranscript;
            };

            // エラー発生時の処理
            recognition.onerror = (event) => {
                console.error("音声認識エラー:", event.error);
                if (event.error === 'not-allowed') {
                    alert("マイクの使用が許可されていません。ブラウザの設定を確認してください。");
                }
            };

            // 録音終了時（無音による自動停止時も含む）
            recognition.onend = () => {
                // ユーザーが停止ボタンを押していないのに自動停止した場合は再開する
                if (isRecording) {
                    try {
                        recognition.start();
                        return;
                    } catch (e) {
                        console.error("再開に失敗しました:", e);
                    }
                }

                // 完全終了時のUI更新
                isRecording = false;
                statusText.innerText = "✅ 聞き取り完了！";
                statusText.classList.remove('text-red-500');
                
                micBtn.innerText = "🎙️ お話を始める";
                micBtn.className = "bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-full shadow-lg transition-all transform active:scale-95";
            };
        }
    </script>
</body>
</html>
