<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ステップ1：文字起こしのテスト</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md text-center">
        <h1 class="text-xl font-bold text-slate-800 mb-4">音声認識テスト</h1>
        
        <p id="status" class="text-sm text-slate-500 mb-6">下のボタンを押して喋ってね</p>

        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 min-h-[100px] text-left text-lg text-slate-700 mb-6" id="result-box">
            ここに喋った言葉が出ます...
        </div>

        <button id="mic-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-full shadow-lg transition-all transform active:scale-95">
            🎙️ お話を始める
        </button>
    </div>

    <script>
        // ブラウザの音声認識を準備します（Web Speech API）
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            alert("お使いのブラウザは音声認識に対応していません。ChromeやSafariで試してね！");
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP'; // 日本語を設定
            recognition.interimResults = true; // 喋っている途中の文字も出す
            recognition.continuous = true; // 喋り終わっても自動で終了しないようにする

            const micBtn = document.getElementById('mic-btn');
            const resultBox = document.getElementById('result-box');
            const statusText = document.getElementById('status');
            let isRecording = false;

            // ボタンを押したときの処理
            micBtn.addEventListener('click', () => {
                if (!isRecording) {
                    recognition.start();
                } else {
                    recognition.stop();
                }
            });

            // 録音スタート時
            recognition.onstart = () => {
                isRecording = true;
                statusText.innerText = "🎤 聞き取り中... 喋ってみてください！";
                statusText.classList.add('text-red-500');
                micBtn.innerText = "🛑 止める";
                micBtn.classList.replace('bg-blue-600', 'bg-red-600');
                resultBox.innerText = "";
            };

            // 喋っている最中・終わったとき
            recognition.onresult = (event) => {
                let speechResult = "";
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    speechResult += event.results[i][0].transcript;
                }
                resultBox.innerText = speechResult;
            };

            // 録音終了時
            recognition.onend = () => {
                isRecording = false;
                statusText.innerText = "✅ 聞き取り完了！";
                statusText.classList.remove('text-red-500');
                micBtn.innerText = "🎙️ お話を始める";
                micBtn.classList.replace('bg-red-600', 'bg-blue-600');
            };
        }
    </script>
</body>
</html>
